name: Run Unit Tests | Amplify UI Swift Liveness

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      identifier:
        required: true
        type: string
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-iOS:
    name: Liveness iOS Unit Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2
        with:
          persist-credentials: false
      - name: Test FaceLiveness
        continue-on-error: false
        uses: ./.github/composite_actions/run_xcodebuild_test
        with:
          scheme: FaceLiveness
          token: ${{ secrets.CODECOV_TOKEN }}
          # Amplify Swift requires Xcode 26.0 or later.
          xcode_path: '/Applications/Xcode_26.5.app'
          destination: 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=26.5'
          generate_coverage: true
          other_flags: '-skipPackagePluginValidation'